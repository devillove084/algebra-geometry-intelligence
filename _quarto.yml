project:
  type: book
  output-dir: _site

book:
  title: "Algebra, Geometry, and Intelligence"
  output-file: algebra-geometry-intelligence
  author: "LuHuanbing"
  date: last-modified
  site-url: "https://devillove084.github.io/algebra-geometry-intelligence/"
  repo-url: "https://github.com/devillove084/algebra-geometry-intelligence"
  repo-actions: [edit, issue]
  search: true

  chapters:
    - index.qmd
    - roadmap.qmd
    - notation.qmd
    - part: "第一部分：数学语言"
      chapters:
        - chapters/00-foundations/index.qmd
        - chapters/00-foundations/numbers-and-sets.qmd
        - chapters/00-foundations/functions.qmd
        - chapters/00-foundations/logic-and-proofs.qmd
        - chapters/00-foundations/calculus-definitions.qmd
        - chapters/00-foundations/probability-statistics-definitions.qmd
    - part: "第二部分：线性代数"
      chapters:
        - chapters/01-linear-algebra/index.qmd
        - chapters/01-linear-algebra/scalars-and-vectors.qmd
        - chapters/01-linear-algebra/matrices-and-linear-maps.qmd
        - chapters/01-linear-algebra/matrix-multiplication-and-composition.qmd
        - chapters/01-linear-algebra/linear-systems-and-elimination.qmd
        - chapters/01-linear-algebra/elimination-inverses-and-invertibility.qmd
        - chapters/01-linear-algebra/lu-plu-factorization-and-triangular-solves.qmd
        - chapters/01-linear-algebra/vector-spaces-bases-and-dimension.qmd
        - chapters/01-linear-algebra/basis-exchange-and-dimension-theorems.qmd
        - chapters/01-linear-algebra/inner-products-angles-and-line-projections.qmd
        - chapters/01-linear-algebra/orthogonal-complements-and-four-fundamental-subspaces.qmd
        - chapters/01-linear-algebra/least-squares-projections-and-normal-equations.qmd
        - chapters/01-linear-algebra/orthonormal-bases-gram-schmidt-and-qr.qmd
        - chapters/01-linear-algebra/permutations-inversions-and-determinants.qmd
        - chapters/01-linear-algebra/determinants-and-linear-systems.qmd
        - chapters/01-linear-algebra/determinant-multiplicativity-cofactors-and-invariants.qmd
    - part: "线性代数专题：分解证明与坐标变换"
      chapters:
        - chapters/01-linear-algebra/lu-existence-and-pivoting-proofs.qmd
        - chapters/01-linear-algebra/coordinate-matrices-change-of-basis-and-similarity.qmd
        - chapters/01-linear-algebra/similarity-determinant-and-trace.qmd
    - part: "附录"
      chapters:
        - appendices/symbol-index.qmd

lang: zh-CN
bibliography: references.bib
csl: styles/china-national-standard-gb-t-7714-2015-numeric.csl

execute:
  freeze: auto
  cache: true

crossref:
  chapters: true
  eq-prefix: "式"
  fig-prefix: "图"
  tbl-prefix: "表"
  sec-prefix: "节"

format:
  html:
    theme:
      light: [litera, styles/custom.scss]
      dark: [slate, styles/custom.scss]
    toc: true
    toc-depth: 4
    lightbox: true
    number-sections: false
    number-depth: 4
    code-copy: true
    code-overflow: scroll
    html-math-method: mathjax
    include-in-header: styles/webfonts.html
  typst:
    papersize: a4
    mainfont: "Noto Sans CJK SC"
    sansfont: "Noto Sans CJK SC"
    monofont: "DejaVu Sans Mono"
    fontsize: 11pt
    toc: true
    toc-depth: 3
    number-sections: false
    keep-typ: true

jupyter: python3
