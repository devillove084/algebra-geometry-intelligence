name: Publish notes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QUARTO_VERSION: "1.9.38"
  PYTHONWARNINGS: "error:Glyph"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements.txt
          python-version: "3.13"

      - name: Install Python dependencies
        shell: bash
        run: uv pip install --requirement requirements.txt

      - name: Restore Quarto execution cache
        id: execution-cache
        uses: actions/cache@v6
        with:
          path: |
            _freeze
            **/.jupyter_cache
          key: quarto-execution-${{ runner.os }}-py3.13-q${{ env.QUARTO_VERSION }}-${{ hashFiles('requirements.txt', '_quarto.yml') }}-${{ hashFiles('**/*.qmd', 'code/**/*.py') }}
          restore-keys: |
            quarto-execution-${{ runner.os }}-py3.13-q${{ env.QUARTO_VERSION }}-${{ hashFiles('requirements.txt', '_quarto.yml') }}-

      - name: Install Chinese fonts
        if: steps.execution-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk fontconfig
          fc-match --format '%{family}\n' "Noto Sans CJK SC" | grep --fixed-strings --quiet "Noto Sans CJK SC"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Install Pandoc Chinese translations
        shell: bash
        run: bash scripts/install-translations.sh

      - name: Validate shell scripts
        shell: bash
        run: bash -n scripts/*.sh

      - name: Regenerate figures
        shell: bash
        run: make figures

      - name: Verify generated figures are current
        shell: bash
        run: git diff --exit-code -- images/linear-algebra

      - name: Render HTML notes
        shell: bash
        run: make build

      - name: Verify generated site
        shell: bash
        run: test -s _site/index.html

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
